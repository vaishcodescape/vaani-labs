[project]
name = "audio-metrics"
version = "0.1.0"
description = "PCM fixture generation, chunk framing, and streaming latency/RTF metrics — no FastAPI/model dependency."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["audio_metrics*"]

[tool.setuptools.package-data]
audio_metrics = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"
