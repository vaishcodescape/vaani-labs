[project]
name = "tts-runtime"
version = "0.1.0"
description = "Acoustic model + streaming vocoder interfaces, deterministic mocks, and the stateful StreamingSynthesisSession engine."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tts_runtime*"]

[tool.setuptools.package-data]
tts_runtime = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"
